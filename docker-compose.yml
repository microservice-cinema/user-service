version: '3.9'

services:
  users-service:
    container_name: users-service
    image: microservice-cinema/users-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    networks:
      - microservice-cinema

networks:
  microservice-cinema:
    external: true